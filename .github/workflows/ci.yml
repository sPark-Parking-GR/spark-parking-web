name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref (e.g. new commits pushed to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Installs this app and every vendor/* workspace member in one pass.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      # Typechecks vendor/types and vendor/ui before this app, via pnpm -r.
      - name: Typecheck
        run: pnpm run typecheck

      - name: i18n message parity
        run: pnpm run check:i18n

      # NEXT_PUBLIC_* are inlined into the client bundle at build time, so the build
      # needs them present. These are CI placeholders, not real keys — the deployed
      # build supplies its own.
      - name: Build
        env:
          NEXT_PUBLIC_MAP_PROVIDER: google
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: ci-placeholder
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: DEMO_MAP_ID
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        run: pnpm run build

      # Proves the image that actually ships still builds from this repo alone.
      - name: Docker build
        run: docker build -t spark-web:ci .

  deploy:
    name: Deploy to Vercel
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Environment secrets are only readable by a job that declares this. Pair this with
    # a branch protection rule on the "production" environment restricting it to main,
    # in Settings -> Environments -> Production -> Deployment branches — that enforces
    # the restriction at the platform level, not just via the `if:` above.
    environment: Production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Replaced the Deploy Hook approach: a hook call returned 2xx and queued a job even
      # when nothing ever showed up in the Deployments tab, with no error surfaced
      # anywhere to explain why. Building and deploying directly from this runner means
      # every failure — auth, build, upload — shows up as a failed step right here.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pulls this project's real Production settings and environment variable values
      # from Vercel — the artifact built below uses real NEXT_PUBLIC_*/SESSION_SECRET
      # values, not the ci job's placeholders (those exist only to prove the build
      # compiles in CI).
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # vercel.json's buildCommand (pnpm run build, which runs build:vendor first) is
      # what actually runs here — this is the same build ci already proved compiles.
      - name: Build with Vercel CLI
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # Uploads the artifact built in the previous step as-is — no second, independent
      # build happens on Vercel's own infrastructure.
      - name: Deploy prebuilt artifact to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
