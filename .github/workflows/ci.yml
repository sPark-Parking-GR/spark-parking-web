name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref (e.g. new commits pushed to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Installs this app and every vendor/* workspace member in one pass.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      # Typechecks vendor/types and vendor/ui before this app, via pnpm -r.
      - name: Typecheck
        run: pnpm run typecheck

      - name: i18n message parity
        run: pnpm run check:i18n

      # NEXT_PUBLIC_* are inlined into the client bundle at build time, so the build
      # needs them present. These are CI placeholders, not real keys — the deployed
      # build supplies its own.
      - name: Build
        env:
          NEXT_PUBLIC_MAP_PROVIDER: google
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: ci-placeholder
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: DEMO_MAP_ID
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        run: pnpm run build

      # Proves the image that actually ships still builds from this repo alone.
      - name: Docker build
        run: docker build -t spark-web:ci .

  deploy:
    name: Deploy to Vercel
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Environment secrets are only readable by a job that declares this. Pair this with
    # a branch protection rule on the "production" environment restricting it to main,
    # in Settings -> Environments -> Production -> Deployment branches — that enforces
    # the restriction at the platform level, not just via the `if:` above.
    environment: Production
    steps:
      # Vercel's own build runs the real deploy; this just starts it, only once every
      # check in the ci job above has passed. scripts/vercel-ignore-build.sh (set as
      # the project's Ignored Build Step) skips Vercel's automatic git-push build for
      # main, so this hook is the only way a push to main reaches production.
      - name: Trigger Vercel deploy
        # Echoed explicitly (not just left to curl's default stdout) so the queued job id
        # always shows up in the step log — a stale/misconfigured hook secret still
        # returns 2xx from Vercel's API, so `curl -f` alone can't catch that, only a human
        # comparing this id against what actually appears in the Deployments tab can.
        run: |
          response="$(curl -sf -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")"
          echo "Vercel response: $response"
